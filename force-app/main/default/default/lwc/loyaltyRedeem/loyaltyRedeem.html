<template>
    <lightning-card title="Reward Points" icon-name="custom:custom19">
        <div slot="actions">
            <lightning-button-icon
                icon-name="utility:refresh"
                alternative-text="Refresh"
                title="Refresh"
                onclick={refresh}>
            </lightning-button-icon>
        </div>

        <div class="slds-p-around_medium">

            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </template>

            <template if:false={isLoading}>
                <!-- Locked state -->
                <template if:true={lockedMessage}>
                    <div class="lr-locked">{lockedMessage}</div>
                </template>

                <!-- Wallet summary -->
                <div class="lr-summary">
                    <div class="lr-summary-row">
                        <span class="lr-summary-label">Customer Balance</span>
                        <span class="lr-summary-value">{balanceFormatted} pts</span>
                    </div>
                    <div class="lr-summary-row">
                        <span class="lr-summary-label">Redeemed on this order</span>
                        <span class="lr-summary-value lr-summary-redeemed">
                            {currentlyRedeemedFormatted} pts
                        </span>
                    </div>
                    <div class="lr-summary-row lr-summary-divider">
                        <span class="lr-summary-label">Available headroom</span>
                        <span class="lr-summary-value">{maxRedeemableFormatted} pts</span>
                    </div>
                </div>

                <!-- Actions -->
                <div class="slds-m-top_medium slds-grid slds-grid_align-center slds-gutters_small">
                    <lightning-button
                        variant="brand"
                        label="Redeem Points"
                        icon-name="utility:money"
                        disabled={redeemDisabled}
                        onclick={openModal}>
                    </lightning-button>
                    <template if:true={hasRedemption}>
                        <div class="slds-m-left_small">
                            <lightning-button
                                variant="destructive-text"
                                label="Clear redemption"
                                icon-name="utility:delete"
                                disabled={clearDisabled}
                                onclick={handleClear}>
                            </lightning-button>
                        </div>
                    </template>
                </div>
            </template>
        </div>

        <!-- Redeem modal -->
        <template if:true={showModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close" onclick={closeModal}>
                            <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                        </button>
                        <h2 class="slds-modal__title slds-hyphenate">Redeem Reward Points</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">

                        <p class="slds-text-body_regular slds-m-bottom_small">
                            Customer has <strong>{balanceFormatted} points</strong> available.
                            Redemption rate: <strong>1 point = ₹1</strong>.
                        </p>

                        <lightning-input
                            type="number"
                            label="Points to redeem"
                            value={pointsInput}
                            min="0"
                            max={maxRedeemable}
                            step="1"
                            onchange={handlePointsChange}
                            message-when-value-missing="Enter a number"
                            field-level-help="1 point = 1 in currency. Will become a discount line on this order on save.">
                        </lightning-input>

                        <p class="slds-m-top_small slds-text-color_weak">
                            That equals <strong>{cashEquivalent}</strong> off this order.
                        </p>

                        <template if:true={pointsInputError}>
                            <p class="slds-text-color_error slds-m-top_small">{pointsInputError}</p>
                        </template>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={closeModal}></lightning-button>
                        <lightning-button
                            class="slds-m-left_x-small"
                            variant="brand"
                            label="Apply"
                            disabled={applyDisabled}
                            onclick={handleApply}>
                        </lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
